<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>The Future Billions | Save the Date</title>

    <meta
      name="description"
      content="You have mail from the future Billions. 💌"
    />

    <meta name="robots" content="noindex, nofollow" />

    <!-- iMessage preview: original envelope image -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="You have mail from the future Billions. 💌"
    />
    <meta
      property="og:image"
      content="https://rachelanordgren.github.io/future-billions/preview.jpg"
    />
    <meta
      property="og:url"
      content="https://rachelanordgren.github.io/future-billions/"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://rachelanordgren.github.io/future-billions/preview.jpg"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #55583b;
      }

      /* Opening envelope screen */
      #opening-screen {
        position: fixed;
        inset: 0;
        z-index: 10;

        width: 100%;
        height: 100dvh;

        padding: 0;
        border: none;
        background: #55583b;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        -webkit-tap-highlight-color: transparent;
      }

      #opening-screen img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .hidden {
        display: none !important;
      }

      /* Full-screen video */
      #wedding-video {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100dvh;

        object-fit: contain;
        background: #000;
        cursor: pointer;
      }

      /* Hide native Safari controls */
      #wedding-video::-webkit-media-controls {
        display: none !important;
      }

      /* Pause indicator */
      #pause-indicator {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;

        color: white;
        font-size: 48px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);

        pointer-events: none;
      }

      /* End-of-video buttons */
      #end-buttons {
        position: fixed;
        bottom: calc(12% + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;

        width: max-content;
      }

      #replay-button,
      #calendar-button {
        display: flex;
        align-items: center;
        justify-content: center;

        min-width: 210px;
        min-height: 48px;
        padding: 14px 24px;

        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 40px;

        background: rgba(0, 0, 0, 0.5);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);

        color: white;
        font-family: Georgia, serif;
        font-size: 16px;
        letter-spacing: 0.3px;
        text-align: center;
        text-decoration: none;

        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      #calendar-button {
        background: #55583b;
      }

      #replay-button:active,
      #calendar-button:active {
        opacity: 0.8;
      }
    </style>
  </head>

  <body>
    <!-- Video, without native controls -->
    <video
      id="wedding-video"
      playsinline
      webkit-playsinline
      preload="auto"
      poster="preview.jpg"
      disablepictureinpicture
      controlslist="nodownload noplaybackrate noremoteplayback"
    >
      <source src="save-the-date.mp4" type="video/mp4" />
      Your browser does not support video playback.
    </video>

    <!-- Opening screen -->
    <button
      id="opening-screen"
      type="button"
      aria-label="Tap to open your save the date"
    >
      <img
        src="tap-to-open.jpg"
        alt="You have mail from the future Billions. Tap to Open. 💌"
      />
    </button>

    <!-- Pause indicator -->
    <div id="pause-indicator" class="hidden" aria-hidden="true">▶</div>

    <!-- End-of-video buttons -->
    <div id="end-buttons" class="hidden">
      <button id="replay-button" type="button">↻ Replay</button>

      <a
        id="calendar-button"
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Rachel%20%26%20Nick%27s%20Wedding&amp;dates=20270611T220000Z%2F20270612T040000Z&amp;details=Ceremony%20at%205%3A00%20PM.%20Reception%20to%20follow.%20Invitation%20to%20follow.&amp;location=Castle%20Unicorn%2C%20Pacific%20Junction%2C%20IA&amp;ctz=America%2FChicago"
        target="_blank"
        rel="noopener noreferrer"
      >
        + Add to Calendar
      </a>
    </div>

    <script>
      const openingScreen = document.getElementById("opening-screen");

      const video = document.getElementById("wedding-video");

      const endButtons = document.getElementById("end-buttons");

      const replayButton = document.getElementById("replay-button");

      const pauseIndicator = document.getElementById("pause-indicator");

      let hasOpened = false;

      // Open the envelope and play with sound.
      openingScreen.addEventListener("click", () => {
        if (hasOpened) return;

        video.currentTime = 0;
        video.muted = false;
        video.volume = 1;

        // Playback is initiated by the guest's tap.
        const playPromise = video.play();

        playPromise
          .then(() => {
            hasOpened = true;
            openingScreen.classList.add("hidden");
          })
          .catch((error) => {
            console.error("Playback failed:", error);

            // Allow another tap if playback was blocked.
            hasOpened = false;
          });
      });

      // Tap the video to pause or resume.
      video.addEventListener("click", () => {
        if (!hasOpened || video.ended) return;

        if (video.paused) {
          video.play().catch(console.error);
        } else {
          video.pause();
        }
      });

      // Show play indicator when paused.
      video.addEventListener("pause", () => {
        if (!video.ended && hasOpened) {
          pauseIndicator.classList.remove("hidden");
        }
      });

      // Hide overlays when playing.
      video.addEventListener("play", () => {
        pauseIndicator.classList.add("hidden");
        endButtons.classList.add("hidden");
      });

      // Display both buttons when video ends.
      video.addEventListener("ended", () => {
        pauseIndicator.classList.add("hidden");
        endButtons.classList.remove("hidden");
      });

      // Replay video with sound.
      replayButton.addEventListener("click", () => {
        video.currentTime = 0;
        video.muted = false;
        video.volume = 1;

        video
          .play()
          .then(() => {
            endButtons.classList.add("hidden");
          })
          .catch((error) => {
            console.error("Replay failed:", error);
            endButtons.classList.remove("hidden");
          });
      });
    </script>
  </body>
</html>
