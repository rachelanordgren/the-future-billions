<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>The Future Billions | Save the Date</title>

    <meta
      name="description"
      content="You have mail from the future Billions. 💌"
    />

    <meta name="robots" content="noindex, nofollow" />

    <!-- iMessage preview: original envelope WITHOUT Tap to Open -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="You have mail from the future Billions. 💌"
    />
    <meta property="og:description" content="From the future Billions." />
    <meta
      property="og:image"
      content="https://rachelanordgren.github.io/future-billions/preview.jpg"
    />
    <meta
      property="og:url"
      content="https://rachelanordgren.github.io/future-billions/"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://rachelanordgren.github.io/future-billions/preview.jpg"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #55583b;
      }

      /* Full-screen opening image */
      #opening-screen {
        position: fixed;
        inset: 0;
        z-index: 10;

        width: 100%;
        height: 100%;
        height: 100dvh;

        padding: 0;
        border: none;
        background: #55583b;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        -webkit-tap-highlight-color: transparent;
      }

      #opening-screen img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      #opening-screen.hidden {
        display: none;
      }

      /* Full-screen video */
      #wedding-video {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;
        height: 100dvh;

        object-fit: contain;
        background: #000;
        cursor: pointer;
      }

      /* Hide native Safari controls */
      #wedding-video::-webkit-media-controls {
        display: none !important;
      }

      /* Replay button */
      #replay-button {
        position: fixed;
        bottom: calc(12% + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;

        padding: 14px 28px;

        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 40px;

        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);

        color: white;
        font-family: Georgia, serif;
        font-size: 17px;
        letter-spacing: 0.5px;

        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      #replay-button.hidden {
        display: none;
      }

      /* Small pause indicator */
      #pause-indicator {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;

        color: white;
        font-size: 48px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);

        pointer-events: none;
      }

      #pause-indicator.hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- Video: no native controls -->
    <video
      id="wedding-video"
      playsinline
      webkit-playsinline
      preload="auto"
      poster="preview.jpg"
      disablepictureinpicture
      controlslist="nodownload noplaybackrate noremoteplayback"
    >
      <source src="save-the-date.mp4" type="video/mp4" />
      Your browser does not support video playback.
    </video>

    <!-- Opening envelope -->
    <button
      id="opening-screen"
      type="button"
      aria-label="Tap to open your save the date"
    >
      <img
        src="tap-to-open.jpg"
        alt="You have got mail from the future Billions. Tap to Open. 💌"
      />
    </button>

    <!-- Pause indicator -->
    <div id="pause-indicator" class="hidden" aria-hidden="true">▶</div>

    <!-- Replay button -->
    <button id="replay-button" class="hidden" type="button">↻ Replay</button>

    <script>
      const openingScreen = document.getElementById("opening-screen");

      const video = document.getElementById("wedding-video");

      const replayButton = document.getElementById("replay-button");

      const pauseIndicator = document.getElementById("pause-indicator");

      let hasOpened = false;

      // Open envelope and play video with sound
      openingScreen.addEventListener("click", () => {
        if (hasOpened) return;

        hasOpened = true;

        video.currentTime = 0;
        video.muted = false;
        video.volume = 1;

        const playPromise = video.play();

        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              openingScreen.classList.add("hidden");
            })
            .catch((error) => {
              console.error("Playback failed:", error);
              openingScreen.classList.add("hidden");
              pauseIndicator.classList.remove("hidden");
            });
        } else {
          openingScreen.classList.add("hidden");
        }
      });

      // Tap video to pause or resume
      video.addEventListener("click", () => {
        if (video.ended) return;

        if (video.paused) {
          video.play().catch(console.error);
        } else {
          video.pause();
        }
      });

      // Show play icon when paused
      video.addEventListener("pause", () => {
        if (!video.ended && hasOpened) {
          pauseIndicator.classList.remove("hidden");
        }
      });

      // Hide play icon while playing
      video.addEventListener("play", () => {
        pauseIndicator.classList.add("hidden");
        replayButton.classList.add("hidden");
      });

      // Show Replay when video ends
      video.addEventListener("ended", () => {
        pauseIndicator.classList.add("hidden");
        replayButton.classList.remove("hidden");
      });

      // Replay from beginning with sound
      replayButton.addEventListener("click", () => {
        video.currentTime = 0;
        video.muted = false;

        replayButton.classList.add("hidden");

        video.play().catch((error) => {
          console.error("Replay failed:", error);
          replayButton.classList.remove("hidden");
        });
      });
    </script>
  </body>
</html>
